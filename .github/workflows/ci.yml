name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20   # a hung test must fail the job, not run for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build DoomBuilder.slnx -c Release
      # --blame-hang-timeout kills a test that stops responding and names it in the log
      - run: dotnet test DoomBuilder.slnx -c Release --no-build --blame-hang --blame-hang-timeout 3m
