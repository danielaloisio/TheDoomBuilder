// Actions of the host application's own edit modes. The full action name is "<assembly>_<name>" (doombuilder.app_viewermode).

viewermode
{
	title = "Viewer Mode";
	category = "modes";
	description = "Shows the map without editing it.";
	allowkeys = true;
	allowmouse = true;
	allowscroll = false;
	disregardshift = true;
	disregardcontrol = true;
}
