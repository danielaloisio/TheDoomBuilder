// Actions used by InputDispatcherTests. Full names are "doombuilder.core.tests_<name>".

testkey
{
	title = "Test key";
	category = "modes";
	description = "Bound to F24 (nothing else uses it)";
	allowkeys = true;
	allowmouse = true;
	allowscroll = true;
	default = 135;       // F24
}

testctrlkey
{
	title = "Test ctrl key";
	category = "modes";
	description = "Bound to Ctrl+K";
	allowkeys = true;
	allowmouse = true;
	allowscroll = true;
	default = 131147;    // Control (0x20000) + K (75)
}

testmiddle
{
	title = "Test middle button";
	category = "modes";
	description = "Bound to the middle mouse button";
	allowkeys = true;
	allowmouse = true;
	allowscroll = true;
	default = 4;         // MButton
}

testscrollup
{
	title = "Test scroll up";
	category = "modes";
	description = "Bound to Ctrl+Alt+wheel up (plain wheel zooms)";
	allowkeys = true;
	allowmouse = true;
	allowscroll = true;
	default = 458746;    // Control (0x20000) + Alt (0x40000) + SpecialKeys.MScrollUp (65530)
}

probemode
{
	title = "Probe mode";
	category = "modes";
	description = "Edit mode that records the events it receives";
	allowkeys = true;
	allowmouse = true;
	allowscroll = false;
}
